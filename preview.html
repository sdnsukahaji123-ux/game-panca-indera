<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petualangan Panca Indera - IPAS Kelas 4</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Trebuchet MS",Arial,sans-serif;min-height:100vh;background:linear-gradient(135deg,#dff8ff,#fff5dc);color:#263238;padding:20px 10px 40px}.container{width:min(900px,96%);margin:auto}header{text-align:center;margin-bottom:18px}.title{font-size:clamp(2rem,6vw,3.5rem);color:#e94b62;text-shadow:3px 3px 0 white}.subtitle{margin-top:8px;color:#4e6870;font-weight:bold}.game-card,.result-card{background:#fffffff5;border-radius:30px;padding:22px;box-shadow:0 12px 35px #2d576429;border:4px solid white}.level-section{text-align:center;margin-bottom:20px}.level-section h2{color:#347ca5;margin-bottom:12px}.level-buttons,.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.level-btn,.next-btn,.restart-btn,.play-again{border:0;border-radius:50px;padding:12px 22px;font:bold 1rem inherit;cursor:pointer}.level-btn{background:#e9f2f5;color:#49616a}.level-btn.active{background:#ffc83d;color:#604700}.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.info-box{text-align:center;padding:12px;border-radius:18px;background:#f1fbff;border:2px solid #d6edf4}.info-label{font-size:.78rem;color:#78909c}.info-value{color:#27799e;font-size:1.5rem;font-weight:bold}.progress-text{display:flex;justify-content:space-between;margin-bottom:7px;font-size:.9rem;font-weight:bold;color:#607d86}.progress-bar{height:13px;background:#e7f0f3;border-radius:50px;overflow:hidden;margin-bottom:20px}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#58c8e8,#65d77a);transition:.4s}.question-box{background:linear-gradient(135deg,#fff7cf,#fff);border-radius:23px;padding:22px;text-align:center;margin-bottom:17px;border:3px solid #ffe58a}.question-number{display:inline-block;background:#ff7190;color:white;padding:7px 15px;border-radius:30px;font-weight:bold;margin-bottom:13px}.question-emoji{font-size:3.5rem;display:block}.question{font-size:clamp(1.2rem,3vw,1.55rem);font-weight:bold;line-height:1.4;color:#354f57}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{min-height:65px;padding:12px 15px;border-radius:17px;border:3px solid #dcecf1;background:white;cursor:pointer;font: bold 1rem inherit;color:#415961;text-align:left;display:flex;align-items:center;gap:10px}.option-letter{min-width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#eaf5f8;color:#367e98}.option.correct{background:#dcffdf;border-color:#68ca70;color:#28722e}.option.wrong{background:#ffe1e5;border-color:#ef7180;color:#a52f40}.option:disabled{cursor:default}.feedback{min-height:54px;margin-top:15px;padding:12px;border-radius:15px;text-align:center;font-weight:bold;line-height:1.4;display:none}.feedback.show{display:block}.feedback.correct{background:#e4ffe5;color:#28722e}.feedback.wrong{background:#fff0d4;color:#825800}.controls{margin-top:18px}.next-btn{background:#58b9e4;color:white;display:none}.restart-btn{background:#ffcb45;color:#604700}.overlay{position:fixed;inset:0;background:#1e3c46ad;display:none;align-items:center;justify-content:center;padding:20px;z-index:2}.result-card{width:min(500px,95%);text-align:center}.result-emoji{font-size:4.5rem}.result-title{font-size:2rem;color:#e94b62;margin:8px 0}.final-score{font-size:2.6rem;color:#27799e;font-weight:bold;margin:10px}.result-detail{color:#607d86;line-height:1.6;margin-bottom:15px}.fact{background:#eefaff;border-radius:17px;padding:13px;color:#49656d;line-height:1.5;margin-bottom:18px}.play-again{background:#65c96e;color:white}@media(max-width:650px){.options{grid-template-columns:1fr}.game-card{padding:15px}.info-value{font-size:1.25rem}}
</style>
</head>
<body><div class="container"><header><h1 class="title">🧠🌈 Panca Indera Ceria</h1><p class="subtitle">Game IPAS Kelas 4 — Yuk Uji Pengetahuanmu!</p></header><main class="game-card"><section class="level-section"><h2>🎮 Pilih Tingkat Kesulitan</h2><div class="level-buttons"><button class="level-btn active" data-level="easy">🌱 Mudah</button><button class="level-btn" data-level="medium">⭐ Sedang</button><button class="level-btn" data-level="hard">🚀 Sulit</button></div></section><section class="info-grid"><div class="info-box"><div class="info-label">🏆 SKOR</div><div class="info-value" id="score">0</div></div><div class="info-box"><div class="info-label">⏱️ WAKTU</div><div class="info-value" id="timer">90</div></div><div class="info-box"><div class="info-label">❤️ BENAR</div><div class="info-value"><span id="correctCount">0</span>/<span id="answeredCount">0</span></div></div></section><div class="progress-text"><span>📚 Kemajuan Belajar</span><span id="progressText"></span></div><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div><section class="question-box"><div class="question-number" id="questionNumber"></div><span class="question-emoji" id="questionEmoji"></span><div class="question" id="question"></div></section><section class="options" id="options"></section><div class="feedback" id="feedback"></div><div class="controls"><button class="next-btn" id="nextBtn">Soal Berikutnya ➜</button><button class="restart-btn" id="restartBtn">🔄 Ulangi Permainan</button></div></main></div><div class="overlay" id="overlay"><div class="result-card"><div class="result-emoji" id="resultEmoji">🏆</div><h2 class="result-title" id="resultTitle">Hebat!</h2><p class="result-detail" id="resultDetail"></p><div class="final-score"><span id="finalScore">0</span> poin</div><div class="fact">💡 <b>Ingat!</b><br>Manusia memiliki lima panca indera: <b>mata, telinga, hidung, lidah, dan kulit.</b></div><button class="play-again" id="playAgain">🎮 Main Lagi</button></div></div>
<script>
const bank={easy:[['Indera yang digunakan untuk melihat adalah ...','👀',['Telinga','Mata','Hidung','Kulit'],1,'Mata merupakan indera penglihatan.'],['Telinga digunakan untuk ...','👂',['Mengecap rasa','Mencium bau','Mendengar bunyi','Melihat benda'],2,'Telinga berfungsi sebagai indera pendengaran.'],['Indera penciuman manusia adalah ...','👃',['Mata','Hidung','Lidah','Kulit'],1,'Hidung digunakan untuk mencium berbagai macam bau.'],['Lidah membantu kita untuk ...','👅',['Mendengar','Melihat','Mengecap rasa','Merasakan sentuhan'],2,'Lidah merupakan indera pengecap.'],['Bagian tubuh yang dapat merasakan panas dan dingin adalah ...','🖐️',['Kulit','Mata','Telinga','Hidung'],0,'Kulit dapat merasakan panas dan dingin.']],medium:[['Saat melihat warna pelangi, indera yang bekerja adalah ...','🌈',['Mata','Telinga','Hidung','Kulit'],0,'Mata membantu kita melihat warna.'],['Manakah pasangan indera dan fungsinya yang benar?','🧠',['Mata — mendengar','Telinga — melihat','Lidah — mengecap','Hidung — meraba'],2,'Lidah berfungsi untuk mengecap rasa.'],['Ketika mendengarkan musik, rangsangan diterima oleh ...','🎵',['Telinga','Mata','Kulit','Hidung'],0,'Gelombang bunyi diterima oleh telinga.'],['Mengapa kita dapat merasakan benda yang kasar?','🪵',['Mata menerima cahaya','Kulit menerima sentuhan','Hidung menerima bau','Telinga menerima bunyi'],1,'Kulit memiliki reseptor sentuhan.'],['Indera untuk mengetahui air hangat atau dingin adalah ...','🌡️',['Kulit','Hidung','Telinga','Mata'],0,'Kulit dapat merasakan perubahan suhu.']],hard:[['Saat menikmati makanan, indera yang terlibat adalah ...','🍱',['Mata dan telinga','Hidung dan lidah','Kulit dan telinga','Mata dan kulit'],1,'Lidah mengenali rasa, hidung mengenali aroma.'],['Pernyataan paling tepat tentang panca indera adalah ...','🧠',['Semua indera sama','Setiap indera memiliki fungsi khusus','Mata untuk semua rangsangan','Lidah untuk mendengar'],1,'Setiap indera menerima rangsangan tertentu.'],['Di tempat gelap, mata membutuhkan ...','🌙',['Bunyi','Cahaya','Bau','Sentuhan'],1,'Mata membutuhkan cahaya agar benda terlihat.'],['Pasangan indera, rangsangan, informasi yang benar adalah ...','🔎',['Mata — cahaya — penglihatan','Telinga — makanan — rasa','Hidung — cahaya — penglihatan','Kulit — bunyi — pendengaran'],0,'Mata menerima cahaya dan menghasilkan penglihatan.'],['Contoh kerja sama beberapa panca indera adalah ...','🎂',['Melihat kue dan mencium aromanya','Mendengar warna kue','Mencium suara kue','Mendengar rasa kue'],0,'Mata melihat kue dan hidung mencium aromanya.']]};
const settings={easy:[90,10],medium:[60,20],hard:[45,30]};let level='easy',qs=[],i=0,score=0,correct=0,answered=0,time=90,timer,locked=false;const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(){clearInterval(timer);qs=shuffle(bank[level]);i=score=correct=answered=0;time=settings[level][0];$('score').textContent=0;$('timer').textContent=time;$('correctCount').textContent=0;$('answeredCount').textContent=0;$('overlay').style.display='none';show();timer=setInterval(()=>{time--;$('timer').textContent=time;if(time<=0){clearInterval(timer);finish(true)}},1000)}function show(){locked=false;let q=qs[i];$('questionNumber').textContent=`Soal ${i+1}`;$('questionEmoji').textContent=q[1];$('question').textContent=q[0];$('progressText').textContent=`Soal ${i+1} dari ${qs.length}`;$('progressFill').style.width=i/qs.length*100+'%';$('feedback').className='feedback';$('feedback').textContent='';$('nextBtn').style.display='none';$('options').innerHTML='';q[2].forEach((text,n)=>{let b=document.createElement('button');b.className='option';b.innerHTML=`<span class="option-letter">${'ABCD'[n]}</span><span>${text}</span>`;b.onclick=()=>answer(n);$('options').appendChild(b)})}function answer(n){if(locked)return;locked=true;answered++;$('answeredCount').textContent=answered;let q=qs[i],bs=document.querySelectorAll('.option');bs.forEach(b=>b.disabled=true);bs[q[3]].classList.add('correct');let f=$('feedback');if(n===q[3]){correct++;score+=settings[level][1];$('score').textContent=score;f.className='feedback show correct';f.innerHTML=`🎉 <b>Benar!</b> +${settings[level][1]} poin<br>${q[4]}`}else{bs[n].classList.add('wrong');f.className='feedback show wrong';f.innerHTML=`😊 <b>Belum tepat.</b><br>Jawaban benar: <b>${q[2][q[3]]}</b>.<br>${q[4]}`}$('correctCount').textContent=correct;$('nextBtn').style.display='inline-block';$('nextBtn').textContent=i===qs.length-1?'🏆 Lihat Hasil':'Soal Berikutnya ➜'}function finish(timeUp=false){clearInterval(timer);$('progressFill').style.width='100%';let p=Math.round(correct/qs.length*100);$('finalScore').textContent=score;$('resultEmoji').textContent=p===100?'🏆':p>=80?'🌟':p>=60?'😊':'💪';$('resultTitle').textContent=p===100?'Sempurna!':p>=80?'Hebat Sekali!':p>=60?'Bagus!':'Tetap Semangat!';$('resultDetail').innerHTML=`Benar <b>${correct}</b> dari <b>${qs.length}</b> soal.${timeUp?'<br>⏰ Waktu permainan telah habis.':''}`;$('overlay').style.display='flex'}$('nextBtn').onclick=()=>{if(!locked)return;if(i<qs.length-1){i++;show()}else finish()};document.querySelectorAll('.level-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.level-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');level=b.dataset.level;start()});$('restartBtn').onclick=start;$('playAgain').onclick=start;start();
</script></body></html>
